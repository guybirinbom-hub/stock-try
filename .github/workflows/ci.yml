name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      # Actions are pinned to full commit SHAs (resolved 2026-09-29 with `git ls-remote --tags`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install hash-locked dependencies and the package
        run: |
          if [ ! -f requirements.lock ]; then
            echo "requirements.lock is missing: refusing to install unpinned dependencies"
            exit 1
          fi
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -c "import stocktry, alpaca, bt; print('stocktry installed from', stocktry.__file__)"
      # The whole suite, offline: tests/conftest.py blocks every non-local socket connection, the data cache
      # (data/, gitignored) is absent in CI and no test needs it, and no broker keys exist in this job.
      - name: Tests (offline; no broker keys, no data cache)
        env:
          STOCKTRY_DATA_DIR: ${{ runner.temp }}/no-data-cache
        run: python -m pytest -q
