name: paper-rebalance

# Manual / API trigger ONLY. No `schedule:` on purpose: GitHub's cron is best
# effort (documented delays of 1-9 hours and dropped runs in 2026). Trigger this
# from an external scheduler (Cloudflare Workers cron or cron-job.org) calling
# POST /repos/<owner>/<repo>/actions/workflows/paper-rebalance.yml/dispatches
# with a fine-grained PAT scoped to this one repository, "Actions: write" only.
# See docs/runbook-paper-trading.md. The runner is idempotent, so a duplicate or
# late trigger is harmless; outside market hours it exits 0 and does nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-24.04
    # The runner stops sending orders 8 minutes after it starts (RunConfig.deadline_s = 480) and then cancels
    # what is still open; the job timeout must comfortably exceed that so GitHub never kills the job between a
    # submit and its cancel.
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # This job receives the paper keys: every package (transitive ones included) is installed from the
      # hash-locked requirements.lock, and the job FAILS rather than fall back to unpinned requirements.txt.
      # The package itself is installed without build isolation, so the pinned setuptools builds it.
      - name: Install hash-locked dependencies
        run: |
          if [ ! -f requirements.lock ]; then
            echo "requirements.lock is missing: refusing to install unpinned dependencies next to the paper keys"
            exit 1
          fi
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      # PAPER keys only. Never store live keys in GitHub. LIVE_TRADING is never set here,
      # so even a live key could not trade: the runner needs LIVE_TRADING=yes-live AND
      # --live AND --i-understand-live.
      #
      # DRY RUN BY DEFAULT: this step prints the plan and submits nothing.
      # To submit PAPER orders (after the dry runs look right for a few days), edit the
      # command below and replace `--dry-run` with `--no-dry-run`, commit, and push.
      # Revert that edit to go back to dry runs. Kill switches: set the repository
      # variable KILL_SWITCH to anything but `off`, or commit a file named KILL_SWITCH.
      - name: Paper rebalance (dry run)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_PAPER_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_PAPER_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH || 'off' }}
          PAPER_STRATEGY: ${{ vars.PAPER_STRATEGY || 'spy_buy_hold' }}
          # Prices come from Alpaca Market Data (licensed through the account), never from Yahoo.
          # Paper-only accounts are entitled to the IEX feed only.
          APCA_DATA_FEED: ${{ vars.APCA_DATA_FEED || 'iex' }}
        run: |
          python scripts/paper_rebalance.py --broker alpaca --strategy "$PAPER_STRATEGY" \
            --price-source alpaca --dry-run --ledger "data/ledger/${PAPER_STRATEGY}.jsonl"

      - name: Keep the shadow ledger (private artifact, 90 days)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-ledger-${{ github.run_id }}
          path: data/ledger/
          if-no-files-found: ignore
          retention-days: 90
